name: oracle-profile

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

# Contract-off comparisons against libmujoco 64156abe. The published-default
# jobs in ci.yml and menagerie-conformance.yml are unchanged: their goldens
# stay the contracted captures, and this workflow does not rewrite them.

env:
  CARGO_TERM_COLOR: always
  FERROMOTION_BUILD_POLICY: mujoco-3.13.0-x86_64-contract-off
  FERROMOTION_ORACLE_SHA256: 64156abef7859ac3cedfa4f589c318ff642d1d5d8d0e078efabff21ab02040bc

jobs:
  contract-off-native:
    name: contract-off native
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Receipt gate self-test
        run: python3 scripts/oracle_profile_ci.py --self-test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract-off toolchain
        run: |
          set -euo pipefail
          ubuntu_indexes() {
            # ubuntu-24.04 runners publish Ubuntu through /etc/apt/apt-mirrors.txt
            # (azure.archive.ubuntu.com). Those list files are named for the
            # mirrorlist, not archive.ubuntu.com. `partial` is not readable, so
            # a recursive find exits non-zero after a successful update.
            find /var/lib/apt/lists -mindepth 1 -maxdepth 1 -type f \
              \( -name '*archive.ubuntu.com*_Packages' \
                 -o -name '*security.ubuntu.com*_Packages' \
                 -o -name '*azure.archive.ubuntu.com*_Packages' \
                 -o -name '*apt-mirrors.txt*_binary-amd64_Packages' \) \
              -print -quit | grep -q .
          }
          updated=0
          for attempt in 1 2 3; do
            echo "apt-get update attempt ${attempt}"
            if sudo apt-get update -o Acquire::Retries=5 && ubuntu_indexes; then
              candidate=$(apt-cache policy cmake | awk '/Candidate:/ {print $2}')
              if [ -n "$candidate" ] && [ "$candidate" != "(none)" ]; then
                updated=1
                break
              fi
              echo "Ubuntu indexes are present but cmake has no install candidate (attempt ${attempt})" >&2
            else
              echo "apt-get update did not publish Ubuntu indexes (attempt ${attempt})" >&2
            fi
            echo "apt lists:" >&2
            ls -1 /var/lib/apt/lists >&2 || true
            sleep 5
          done
          if [ "$updated" != 1 ]; then
            echo "Ubuntu package indexes are missing after 3 apt-get update attempts" >&2
            exit 1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=5 clang-18 cmake ninja-build python3-numpy g++-14 python3-venv
          command -v cmake
          cmake --version
          command -v ninja
          ninja --version
          python3 -c 'import numpy; print(numpy.__file__)'
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Build libmujoco 64156abe and the native dump
        run: bash scripts/oracle_profile_prepare.sh native
      - name: Native comparison
        run: python3 scripts/oracle_profile_ci.py --phase native --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-native.txt"
      - name: mesh_graph comparison
        run: python3 scripts/oracle_profile_ci.py --phase graph --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-mesh-graph.txt"

  contract-off-conformance:
    name: contract-off conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Receipt gate self-test
        run: python3 scripts/oracle_profile_ci.py --self-test
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Contract-off toolchain
        run: |
          set -euo pipefail
          ubuntu_indexes() {
            # ubuntu-24.04 runners publish Ubuntu through /etc/apt/apt-mirrors.txt
            # (azure.archive.ubuntu.com). Those list files are named for the
            # mirrorlist, not archive.ubuntu.com. `partial` is not readable, so
            # a recursive find exits non-zero after a successful update.
            find /var/lib/apt/lists -mindepth 1 -maxdepth 1 -type f \
              \( -name '*archive.ubuntu.com*_Packages' \
                 -o -name '*security.ubuntu.com*_Packages' \
                 -o -name '*azure.archive.ubuntu.com*_Packages' \
                 -o -name '*apt-mirrors.txt*_binary-amd64_Packages' \) \
              -print -quit | grep -q .
          }
          updated=0
          for attempt in 1 2 3; do
            echo "apt-get update attempt ${attempt}"
            if sudo apt-get update -o Acquire::Retries=5 && ubuntu_indexes; then
              candidate=$(apt-cache policy cmake | awk '/Candidate:/ {print $2}')
              if [ -n "$candidate" ] && [ "$candidate" != "(none)" ]; then
                updated=1
                break
              fi
              echo "Ubuntu indexes are present but cmake has no install candidate (attempt ${attempt})" >&2
            else
              echo "apt-get update did not publish Ubuntu indexes (attempt ${attempt})" >&2
            fi
            echo "apt lists:" >&2
            ls -1 /var/lib/apt/lists >&2 || true
            sleep 5
          done
          if [ "$updated" != 1 ]; then
            echo "Ubuntu package indexes are missing after 3 apt-get update attempts" >&2
            exit 1
          fi
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Acquire::Retries=5 clang-18 cmake ninja-build python3-numpy g++-14 python3-venv
          command -v cmake
          cmake --version
          command -v ninja
          ninja --version
          python3 -c 'import numpy; print(numpy.__file__)'
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Build libmujoco 64156abe and the step dump
        run: bash scripts/oracle_profile_prepare.sh step
      - name: 20-step comparison
        run: python3 scripts/oracle_profile_ci.py --phase step --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-step.txt"
