name: 3.13 contract-off

on:
  push:
    branches: [main, "cursor/**", "chore/**"]
  pull_request:

# 3.13 contract-off oracle gate. Profile mujoco-3.13.0-x86_64-contract-off.
# libmujoco sha256 64156abef7859ac3cedfa4f589c318ff642d1d5d8d0e078efabff21ab02040bc,
# verified by scripts/oracle_profile_ci.py against conformance/oracle_x86_contract_off.json.
# The pin is docs/acceptance/receipts/e1c052f10eae4d4aef1ddab0e0887b2754afde4f.md
# sha256 82981186caed2e17868dc605f57222371caa1de2a496423f6ba2427cc398a693.
# It names code e1c052f. The previous pin
# 2aeb3611c9f3edca1961eb25ee374df56229d799.supersedes-c590d3a2.md is unchanged.
# c590d3a2 stays superseded. The gate requires 212/212 20-step bit-exact
# (exact set caa71f582e61cf5eda1adcba7ff572da4ac4fb76596f8fd3a0f2232a1d5018bc)
# and native 636/636, exactly as that receipt records. A loss fails.
# An unreceipted gain fails. The receipt file itself is not edited.
# The library is fetched and built by scripts/oracle_profile_prepare.sh,
# the same way this profile workflow already did.
# The published-default bit-exact gate is a different workflow. Its goldens
# stay the contracted captures, and this workflow does not rewrite them.

env:
  CARGO_TERM_COLOR: always
  FERROMOTION_BUILD_POLICY: mujoco-3.13.0-x86_64-contract-off
  FERROMOTION_ORACLE_SHA256: 64156abef7859ac3cedfa4f589c318ff642d1d5d8d0e078efabff21ab02040bc

jobs:
  contract-off-native:
    name: 3.13 contract-off native (636/636)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Receipt gate self-test
        run: python3 scripts/oracle_profile_ci.py --self-test
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - name: Contract-off toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake g++-14 python3-venv
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Build libmujoco 64156abe and the native dump
        run: bash scripts/oracle_profile_prepare.sh native
      - name: Native comparison
        run: python3 scripts/oracle_profile_ci.py --phase native --receipt docs/acceptance/receipts/e1c052f10eae4d4aef1ddab0e0887b2754afde4f.md --receipt-sha256 82981186caed2e17868dc605f57222371caa1de2a496423f6ba2427cc398a693 --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-native.txt"
      - name: mesh_graph comparison
        run: python3 scripts/oracle_profile_ci.py --phase graph --receipt docs/acceptance/receipts/e1c052f10eae4d4aef1ddab0e0887b2754afde4f.md --receipt-sha256 82981186caed2e17868dc605f57222371caa1de2a496423f6ba2427cc398a693 --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-mesh-graph.txt"

  contract-off-conformance:
    name: 3.13 contract-off 20-step (212/212)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Receipt gate self-test
        run: python3 scripts/oracle_profile_ci.py --self-test
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - name: Contract-off toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 cmake g++-14 python3-venv
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
      - name: Build libmujoco 64156abe and the step dump
        run: bash scripts/oracle_profile_prepare.sh step
      - name: 20-step comparison
        run: python3 scripts/oracle_profile_ci.py --phase step --receipt docs/acceptance/receipts/e1c052f10eae4d4aef1ddab0e0887b2754afde4f.md --receipt-sha256 82981186caed2e17868dc605f57222371caa1de2a496423f6ba2427cc398a693 --lib "$RUNNER_TEMP/oracle/lib/libmujoco.so.3.13.0" --menagerie "$RUNNER_TEMP/menagerie" --dump "$RUNNER_TEMP/oracle/x86-step.txt"
