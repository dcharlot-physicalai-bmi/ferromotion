name: menagerie-conformance

on:
  pull_request:
  push:
    branches: [main, "cursor/**", "chore/**"]

# This workflow is the conformance gate. A checked-in ledger is not read back as
# a success. The job fails if MuJoCo or the corpus pin is missing, if any XML is
# unclassified, or if any loadable model disagrees bit-for-bit.
#
# Branch protection is not changed here. To make this check required on the
# repository, a repository administrator sets, outside this workflow:
#   required status check: menagerie-conformance / bit-exact
#   (GitHub's check name is "<workflow name> / <job name>")
# That setting was not applied by this change.

env:
  CARGO_TERM_COLOR: always

jobs:
  bit-exact:
    name: bit-exact
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown, aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2.9.3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12.16"
      - name: Pin check
        run: python3 scripts/menagerie_conformance.py --self-test
      - name: MuJoCo 3.13.0
        run: python3 -m pip install "mujoco==3.13.0" "numpy==2.5.4"
      - name: Menagerie at the pinned sha
        run: |
          set -euo pipefail
          sha=$(python3 -c 'import json; print(json.load(open("conformance/menagerie_pin.json"))["menagerie_sha"])')
          git clone --filter=blob:none https://github.com/google-deepmind/mujoco_menagerie.git "$RUNNER_TEMP/menagerie"
          git -C "$RUNNER_TEMP/menagerie" checkout "$sha"
          test "$(git -C "$RUNNER_TEMP/menagerie" rev-parse HEAD)" = "$sha"
      - name: Execute conformance
        run: python3 scripts/menagerie_conformance.py "$RUNNER_TEMP/menagerie" --out conformance/menagerie_ledger.json
      - name: Upload ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: menagerie-ledger
          path: conformance/menagerie_ledger.json
