name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test (native)
        run: cargo test --workspace
      # ⛔ THIS DOES NOT COVER THE GPU PATH, and the runner cannot. `cargo test --workspace` enables no
      # features, so the 28 tests behind `--features gpu` in ferromotion-core, -control, -fem and
      # -fluid are not even compiled into a test binary here; and ubuntu-latest has no adapter, so
      # running them would only make them skip.
      #
      # Worse, a skip used to be indistinguishable from a run: every one of those 28 guarded itself
      # with `else { eprintln!("no GPU — skipping"); return; }` and PASSED. "22 passed" and
      # "22 skipped" printed the same result line. `FERROMOTION_REQUIRE_GPU=1` now turns a missing
      # adapter into a failure, so the GPU path can be verified where the hardware is:
      #
      #   FERROMOTION_REQUIRE_GPU=1 cargo test -p ferromotion-core    --features gpu --lib gpu::
      #   FERROMOTION_REQUIRE_GPU=1 cargo test -p ferromotion-control --features gpu --lib gpu::
      #   FERROMOTION_REQUIRE_GPU=1 cargo test -p ferromotion-fem     --features gpu --lib gpu::
      #   FERROMOTION_REQUIRE_GPU=1 cargo test -p ferromotion-fluid   --features gpu --lib lbm
      #
      # Measured 2026-09-09 on an Apple M-series (Metal): 22 / 1 / 2 / 12 passed with the variable set,
      # so all four crates genuinely reach the hardware. A self-hosted GPU runner is what would make
      # this a gate rather than a documented boundary; until then the compile side is covered by the
      # clippy step below, which does pass --all-features.
      - name: Benchmark (Ghia lid-driven cavity, release)
        run: cargo test -p ferromotion-fluid --release -- --ignored
      # Settles cantilevers to rest at dt = 3e-6 to pin the near-incompressible locking bias. Seconds in
      # release, minutes in the debug profile the main suite uses, so it lives here rather than there.
      - name: Near-incompressible FEM locking bound (release)
        run: cargo test -p ferromotion-fem --release -- --ignored
      # Measures a surface influence function with a real 3D solve and validates the convolution gel
      # against it. Two FEM relaxations, so release only.
      - name: Elastic tactile gel vs a 3D solve (release)
        run: cargo test -p ferromotion-tactile --release -- --ignored
      # ⛔ ADDED 2026-09-09, and until then `delan_recovers_the_true_mass_matrix` RAN NOWHERE. There are
      # four #[ignore] tests in the workspace and this lane covered three crates; the fourth is in
      # ferromotion-learn, its reason string said "run explicitly", and nothing did. `cargo test
      # --workspace` skips it by definition, so the strongest claim that crate makes — that a learned
      # Lagrangian recovers the true mass matrix — had no gate at all. It passes at a worst term of
      # 0.026; its reason string and its assertion had disagreed by 3x, and delan.rs now carries the
      # training-step sweep that says why the bound is 0.10 and not the 0.05 the string implied.
      - name: DeLaN recovers the true mass matrix (release)
        run: cargo test -p ferromotion-learn --release -- --ignored
      # An EXCLUSION, not an enumeration. The enumerated list had silently omitted seven crates that do
      # build for wasm32 — including ferromotion-learn and ferromotion-fem, whose own READMEs advertise
      # "native + wasm32". A list of what to include drifts as crates are added; a list of what to skip
      # fails loudly when a new crate breaks the target, which is the direction that helps.
      #
      # ferromotion-viz is the one genuine exception: it pulls a tokio feature set that is not supported on
      # wasm ("Only features sync,macros,io-util,rt,time are supported on wasm").
      - name: Build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown --workspace --exclude ferromotion-viz

      # Both of these were local-only discipline until 2026-08-15 and therefore enforced only by memory.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The doc build catches a class nothing else does: intra-doc links to private or non-existent items,
      # which ship as broken links on docs.rs. Its first run found 22, one of which was a `pub fn` in a
      # private module that no external caller could reach at all.
      - name: Docs (broken intra-doc links are errors)
        run: cargo doc --all-features --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
