name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Test (native)
        run: cargo test --workspace
      - name: Benchmark (Ghia lid-driven cavity, release)
        run: cargo test -p ferromotion-fluid --release -- --ignored
      # Settles cantilevers to rest at dt = 3e-6 to pin the near-incompressible locking bias. Seconds in
      # release, minutes in the debug profile the main suite uses, so it lives here rather than there.
      - name: Near-incompressible FEM locking bound (release)
        run: cargo test -p ferromotion-fem --release -- --ignored
      # Measures a surface influence function with a real 3D solve and validates the convolution gel
      # against it. Two FEM relaxations, so release only.
      - name: Elastic tactile gel vs a 3D solve (release)
        run: cargo test -p ferromotion-tactile --release -- --ignored
      # An EXCLUSION, not an enumeration. The enumerated list had silently omitted seven crates that do
      # build for wasm32 — including ferromotion-learn and ferromotion-fem, whose own READMEs advertise
      # "native + wasm32". A list of what to include drifts as crates are added; a list of what to skip
      # fails loudly when a new crate breaks the target, which is the direction that helps.
      #
      # ferromotion-viz is the one genuine exception: it pulls a tokio feature set that is not supported on
      # wasm ("Only features sync,macros,io-util,rt,time are supported on wasm").
      - name: Build (wasm32-unknown-unknown)
        run: cargo build --target wasm32-unknown-unknown --workspace --exclude ferromotion-viz

      # Both of these were local-only discipline until 2026-08-15 and therefore enforced only by memory.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # The doc build catches a class nothing else does: intra-doc links to private or non-existent items,
      # which ship as broken links on docs.rs. Its first run found 22, one of which was a `pub fn` in a
      # private module that no external caller could reach at all.
      - name: Docs (broken intra-doc links are errors)
        run: cargo doc --all-features --no-deps --workspace
        env:
          RUSTDOCFLAGS: -D warnings
