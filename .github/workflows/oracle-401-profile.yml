name: oracle-401-profile

# The 4.0.1 contract-off profile. The pin is the latest receipt for
# mujoco-4.0.1-x86_64-contract-off. It does not read the 4.0.0 receipt.
on:
  push:
    branches:
      - cursor/mujoco-versioned-oracles-f013
  pull_request:
    branches:
      - cursor/mujoco-versioned-oracles-f013

env:
  CARGO_TERM_COLOR: always

jobs:
  profile:
    name: 4.0.1 contract-off counts
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Compiler and archiver
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y clang-18 cmake ninja-build python3-numpy g++-14 binutils
          /usr/lib/llvm-18/bin/clang --version
          test -x /usr/bin/ld.gold
          ld.gold --version | head -1 | grep -q '1.16'
      - name: MuJoCo 4.0.1 source tarball
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/mujoco-4.0.1.tar.gz https://codeload.github.com/google-deepmind/mujoco/tar.gz/refs/tags/4.0.1
          (cd /tmp && sha256sum -c "$GITHUB_WORKSPACE/scripts/oracle_x86/mujoco-4.0.1.tar.gz.sha256")
          mkdir -p /tmp/mujoco-4.0.1-src
          tar -xzf /tmp/mujoco-4.0.1.tar.gz -C /tmp/mujoco-4.0.1-src --strip-components=1
          grep -q 'mjVERSION_HEADER 4000001' /tmp/mujoco-4.0.1-src/include/mujoco/mujoco.h
      - name: Contract-off library
        run: bash scripts/build_mujoco_x86_contract_off.sh 4.0.1 /tmp/mujoco-4.0.1-src /tmp/oracle-x86-contract-off-4.0.1
      - name: Menagerie pin
        run: |
          set -euo pipefail
          sha=$(python3 -c 'import json; print(json.load(open("conformance/menagerie_pin.json"))["menagerie_sha"])')
          git clone https://github.com/google-deepmind/mujoco_menagerie.git /tmp/mujoco_menagerie
          git -C /tmp/mujoco_menagerie checkout --detach "$sha"
      - name: Dumps
        run: |
          set -euo pipefail
          cc -O2 -I/tmp/mujoco-4.0.1-src/include scripts/oracle_schema_dump.c \
            /tmp/oracle-x86-contract-off-4.0.1/build/lib/libmujoco.so.4.0.1 \
            -o /tmp/oracle_schema_dump \
            -Wl,-rpath,/tmp/oracle-x86-contract-off-4.0.1/build/lib -lm
          /tmp/oracle_schema_dump schema | tee /tmp/schema.txt
          grep -q 'ferromotion.mujoco-dump.v3' /tmp/schema.txt
          test -d /tmp/oracle-x86-contract-off-4.0.1/build/lib/mujoco_plugin
          mkdir -p /tmp/oracle-dumps
          /tmp/oracle_schema_dump props /tmp/mujoco_menagerie /tmp/oracle-x86-contract-off-4.0.1/build/lib/mujoco_plugin /tmp/oracle-dumps/props.txt
          python3 scripts/oracle_schema_schedule.py /tmp/oracle-dumps/props.txt native /tmp/oracle-dumps/native-schedule.txt
          python3 scripts/oracle_schema_schedule.py /tmp/oracle-dumps/props.txt step /tmp/oracle-dumps/step-schedule.txt
          /tmp/oracle_schema_dump native /tmp/mujoco_menagerie /tmp/oracle-x86-contract-off-4.0.1/build/lib/mujoco_plugin /tmp/oracle-dumps/native-schedule.txt /tmp/oracle-dumps/native.txt
          /tmp/oracle_schema_dump step /tmp/mujoco_menagerie /tmp/oracle-x86-contract-off-4.0.1/build/lib/mujoco_plugin /tmp/oracle-dumps/step-schedule.txt /tmp/oracle-dumps/step.txt
      - name: Profile
        env:
          FERROMOTION_BUILD_POLICY: mujoco-4.0.1-x86_64-contract-off
          FERROMOTION_ORACLE_SHA256: 5491d70f1168c1fed16dca689bd6c63d6af5abb4d9a3d6146fdfae13e40dafa6
        run: |
          set -euo pipefail
          cargo build --release -p ferromotion-core --example menagerie_native --example menagerie_native_step
          ./target/release/examples/menagerie_native /tmp/mujoco_menagerie /tmp/oracle-dumps/native.txt > /tmp/oracle-dumps/profile-native.txt
          MENAGERIE_LEDGER=/tmp/oracle-dumps/profile-ledger.jsonl \
            ./target/release/examples/menagerie_native_step /tmp/mujoco_menagerie /tmp/oracle-dumps/step.txt > /tmp/oracle-dumps/profile-step.txt
          python3 scripts/oracle_profile_gate.py \
            --oracle-id mujoco-4.0.1-x86_64-contract-off \
            --native /tmp/oracle-dumps/profile-native.txt \
            --step /tmp/oracle-dumps/profile-step.txt \
            --ledger /tmp/oracle-dumps/profile-ledger.jsonl \
            --lib /tmp/oracle-x86-contract-off-4.0.1/build/lib/libmujoco.so.4.0.1 \
            --native-dump /tmp/oracle-dumps/native.txt \
            --step-dump /tmp/oracle-dumps/step.txt
