
# Patched copy of crates.io urdf-rs 0.10.0. The published crate requires
# quick-xml ^0.39, which is RUSTSEC-2026-0194 and RUSTSEC-2026-0195
# (fixed in quick-xml >= 0.41.0). 0.42 is source-compatible with the calls
# this crate makes. Upstream 0.10.0, released 2026-09-25, did not take that fix.
[package]
name = "urdf-rs"
# When publishing a new version:
# - Create "v0.x.y" git tag
# - Push the above tag (run `git push origin --tags`)
# Then, CI will publish to crates.io and create a GitHub release.
version = "0.10.0"
authors = ["Takashi Ogura <t.ogura@gmail.com>"]
edition = "2021"
description = "URDF parser"
license = "Apache-2.0"
keywords = ["robotics", "robot", "ros", "urdf"]
categories = ["data-structures", "parsing"]
repository = "https://github.com/openrr/urdf-rs"

# Note: serde is public dependency.
[dependencies]
quick-xml = { version = "0.42", features = ["overlapped-lists", "serialize"] }
regex = "1.4.2"
RustyXML = "0.3.0"
serde = { version = "1.0.118", features = ["derive"] }
serde-xml-rs = "0.6.0"
thiserror = "2.0.0"

[dev-dependencies]
assert_approx_eq = "1"
