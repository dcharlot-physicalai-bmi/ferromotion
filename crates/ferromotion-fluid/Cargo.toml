[package]
name = "ferromotion-fluid"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "2D incompressible Navier-Stokes (MAC projection) for fluid–robot interaction. WASM-clean."

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }
ferromotion-core = { path = "../ferromotion-core", version = "0.33.0" }

[dev-dependencies]
ferromotion-learn = { path = "../ferromotion-learn", version = "0.33.0" }
pollster = "0.4"

[features]
## The fabric GPU path: wgpu-portable LBM (Metal/Vulkan/DX12 native, WebGPU in the browser).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies.wgpu]
version = "30"
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dependencies.bytemuck]
version = "1"
optional = true

[[example]]
name = "lbm_mlups"
required-features = ["gpu"]

[[example]]
name = "lbm3d_mlups"
required-features = ["gpu"]