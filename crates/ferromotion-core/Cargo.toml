[package]
name = "ferromotion-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Robot kinematic optimization in Rust — FK, analytic Jacobians, Levenberg-Marquardt IK. WASM-clean."

# docs.rs builds with DEFAULT features only, so the `gpu` module would be absent from the rendered docs —
# a reader browsing docs.rs would conclude the GPU path does not exist. Document everything.
[package.metadata.docs.rs]
all-features = true

[dependencies]
nalgebra.workspace = true
urdf-rs = "0.9"
clarabel = "0.11"
faer = { version = "0.24", default-features = false, features = ["std"] }

[features]
## The wgpu GPU path: portable batch collision-checking (Metal/Vulkan/DX12 native, WebGPU in the browser).
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

[dependencies.wgpu]
version = "30"
optional = true

[dependencies.pollster]
version = "0.4"
optional = true

[dependencies.bytemuck]
version = "1"
optional = true

[dev-dependencies]
# Pinned clock-contract peer. The integration test round-trips receipt v2 text.
# It does not make the envelope, the joint loop, or inference interoperable.
ferromorphic = { git = "https://github.com/dcharlot-physicalai-bmi/ferromorphic.git", rev = "15e219b8f7f1bc76029c359df676cbbcf9817ec0" }

[[example]]
name = "gpu_floating_gait_rl"
required-features = ["gpu"]

[lints]
workspace = true
