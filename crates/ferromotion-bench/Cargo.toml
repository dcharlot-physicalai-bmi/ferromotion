[package]
name = "ferromotion-bench"
# Inherits the workspace's package metadata like every sibling crate (2026-08-14). This manifest used to
# hardcode `version` and `license` and omit authors/homepage/repository/keywords/categories entirely, which
# had two consequences: the version had to be bumped by hand at every release, and the license read
# `Apache-2.0` while the workspace and all seventeen sibling crates are `MIT OR Apache-2.0` with both
# LICENSE-MIT and LICENSE-APACHE at the repository root. A consumer reading this crate's page would have
# seen it as more restrictive than the project it belongs to.
version.workspace = true
edition.workspace = true
# LOWER than the workspace floor of 1.89, deliberately. That floor comes from `nalgebra`, and this crate has
# no dependencies at all — verified with `cargo +1.85.0 check -p ferromotion-bench`, which is the only crate
# in the workspace that passes on 1.85. 1.85 is the edition-2024 minimum, so it cannot go lower. Keeping it
# here means a project on an older toolchain can still use the measurement harness on its own.
rust-version = "1.85"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Dependency-free measurement harness for ferromotion, with the statistics the claims need."

[dependencies]

# Path dependencies need a `version` to be publishable. These are dev-only, but they are declared the same
# way as everywhere else in the workspace so a release bump is a single find-and-replace.
[dev-dependencies]
ferromotion-core = { path = "../ferromotion-core", version = "0.68.0" }
ferromotion-cloth = { path = "../ferromotion-cloth", version = "0.68.0" }
ferromotion-control = { path = "../ferromotion-control", version = "0.68.0" }
ferromotion-learn = { path = "../ferromotion-learn", version = "0.68.0" }
nalgebra.workspace = true

[lints]
workspace = true
